="global-search-empty" id="global-search-empty" hidden>未找到</p><ol id="global-search-results"></ol></div></div></div><p class="global-search-status" id="global-search-status" aria-live="polite"></p><script id="global-search-index" type="application/json">[{"title":"Vim 配置与使用","url":"/learning/251027m/","category":"💡 知识库","tags":["编程"],"text":"配置 vim \" 行号 set number \" 关闭自动注释（对粘贴多行有用） set paste \" 设置颜色主题 colorscheme desert set backspace=2 \" 语法高亮 syntax on \" 智能对齐 set smartindent \" 在处理未保存或只读文件时，弹出确认 set confirm \" tab 宽度 set tabstop=4 \" 统一缩进（为4） set softtabstop=4 set shiftwidth=4 \" 历史记录数 set history=50 \" 搜索逐字符高亮 set hlsearch set incsearch \" 编码设置 set encoding=utf 8 \" 设置语言 set langmenu=zn CN.UTF 8 set helplang=cn \" 设置命令行的高度 set cmdheight=1 \" 在编辑时，右下角显示光标位置的状态行 set ruler \" 光标在移动到 buffer 的顶部与底部时保持的距离 set scrolloff=3 \" 高亮显示对应的括号 set showmatch \" 对应括号高亮的时间（单位是十分之一秒） set matchtime=5 \" 总是显示状态行 set laststatus=2 \" 高亮显示多余的空格或制表符 highlight ExtraWhitespace ctermbg=red guibg=red autocmd BufWinEnter match ExtraWhitespace /\\s+$\\ \\+\\ze\\t\\+\\ \\t\\+\\zs \\+/ 修改 /.vimrc 以使用，或修改 /etc/vim/vimrc（Ubuntu 20.04）来为所有用户应用。 使用 尽可能包含使用逻辑的说明。 模式 （待写）"},{"title":"夜访新学生服务中心","url":"/travel/240407s/","category":"🚃 旅和游","tags":[],"text":"清明节假期没去踏青，最后一天心血来潮潜入了还未交付的新学生服务大楼探索了一番。大楼从内至外都修葺得相当气派，内部四通八达、格局通透，外部毗邻涵泽湖，与湖水相得益彰。但有些格局设计还是有问题的，一楼有几个卫生间有一面是大窗或者大落地窗，从外面来看卫生间内一览无余，看到的时候实在忍不住发笑。 这座新楼应该会作为重要的人防设施。地下停车场不光正门口立有重门，连各个连通一层地面的通道也都建有红色的防爆门，再加上与地面连接的通道数量不少，于是表现出敦实的避难所的样貌。 就是探索的时候有个电梯可能是因为故障自动关关合合的，配合上机械地重复着的开关门语音和杂乱的工地场景，很有末世独有的恐怖氛围。 多次感觉需要广角镜头和偏振镜，有钱了一定买一个。另外，黑色的场景拍多了确实容易让人感到风格固化审美疲劳啊。"},{"title":"《超级学习者》笔记","url":"/reports/240224a/","category":"👓 观阅闻后感","tags":["书"],"text":"机械工业出版社华章分社（电子书）2022 版，加拿大，斯科特·H. 杨（Scott H. Young）著，姚育红 译 总评 这本书是最早在 B 站上看到有人做英文版的解析，看到标题觉得有点意思，就自己找了中文版来读。虽说这类成功学书籍用的例子难免有鸡汤的嫌疑，但书中提到的原则、方法从理性上思考，无论整体来看还是部分来看都颇有道理，再加之书末附有参考文献，因此本书还是很有可取之处的。 在这里做一个总结，随后是比较详细的笔记。笔记中用了不少引用，以包含足够的信息。 本书的核心提到了 9 个原则，笔者在此将其划分为 3 块： 第一块是启动学习项目前的准备。一方面需要弄清楚学什么，即“ 元学习 ”，另一方面确定了学习的过程中需要 专心 。同时需要注意贯穿整个学习过程的一个点，即学习要看成自发的一项活动，而不是外部强加的内容，从而减轻或消除痛苦感，提高效率。 第二块是学习项目过程中的一些方法。通过查看结合实际应用会涉及到的内容来 直接 学习项目的核心，在这个过程中通过 训练 薄弱项来提高表现，同时一方面通过闭卷自由联想的方式来 检索 脑袋里的知识，对自己进行检测，另一方面勇于寻求直接、有效的强 反馈 来校正自己的学习内容和路线。 第三块是对项目过程中学习效果的说明。最单一的效果即为 记忆 ，但这往往不够，还需要更深刻的理解来建立对知识的敏感度和熟悉度，也即培养一种对知识的 直觉 ，最后如果想发掘出适合自己的方法、技巧等，还需要积极地进行 试验 ，包括对前面提到的所有内容进行试验，由此形成闭环。 书中的理论和方法都不错，合起来用拆开来用都能有所裨益，但也要注意不能陷入教条主义，需要结合自己和项目的实际，不断熟练之后形成一种“直觉”。最理想的状态是成为一个自主、灵活、高效的学习者。 \\ ( 数字) 代表引用的（电子书的）位置。 原则一：元学习 元学习：元即“meta”，指向事物本身。元学习即对“学习”这件事的学习。 方法 确定三个内容： 1. 动机 分为工具型、内在型。 工具型的做额外研究，确定是否真的可以实现目标，可以通过访谈（电邮、社交软件、论坛；电邮沟通的时候注意简洁明了，第一次接触不要要求太多，注意文字无法包含语气信息，所以小心选择措辞）; 内在型需要确定学习计划和教材是否与目标完成一致。 2. 内容 对知识是如何构成的进行头脑风暴，确定需要不同程度掌握的概念、事实和程序。 概念，即需要理解而不仅是记忆的东西，对有挑战的这些内容进行重点标记，即可找到学习时的瓶颈，从而进一步研究学习的方法；事实，即只需要记忆即可的东西；程序，即不涉及多少有意识思考的行动，例如学习语言时的发音等（e.g. 发音） 3. 方式 包括资源、环境、方法等。关于方法的寻找，分为两个部分。 第一个部分是预设一个策略作为起点，例如学习技能或学科的通用方法，如课程设置。第二个部分是“强调/学习法”，即找到和目标一致的领域，忽略或推迟与目标不一致的部分。 如何判断调研什么时候终止，开始进行学习？ 比较好的经验方法：10% 法则：投入大约 10% 的预期学习时间在调查研究上。且，随着学习项目扩大，这个比例要缩小。 “...只是确保，你没有盲目抓住第一个可能的资源或方法，或者完全不去考虑其他选择。( 1084)” 了解常用的学习方法、大众接受的资源和工具以及它们的优缺点。 收益递减和边际效益计算 学习过程中必须要考虑重新评估：元学习研究不是一次性活动。 由于调研的难以完全充分，同样的信息带来的进步可能是收益递减的：随着学习的进行，该方法越感进步乏力。 如何重新评估：比较元学习和常规学习的边际收益。 一种方法：花更多时间做研究，在每种方法上花些时间，然后比较相对价值。若额外的研究没有太大帮助，最好坚持原先的计划。 重新评估的回报往往起伏不定，可能花了很久也没有什么收获。 可以结合前面的 10% 法则来进行。 元学习具有长期价值 获取收集资源的新渠道、更好的时间管理方法，以及自信心等。随着项目增多，元学习能力也会逐渐提升，从而开始良性循环。 原则二：专注 “要想在学术领域做出伟大的学术成就，科学家都必须能够迅速地专注下来。( 1147)” 人与专注力的斗争 通常分为三种类型：① 如何开始专注；② 如何持续专注；③ 如何优化专注的质量。 需要想出解决这三个问题的方法。 1. 问题1：拖延 较为简单的原因：有对别的事物的渴望，或者有对当前事物的厌恶。 “拖延大多是无意识的。( 1180)” 解决方案： 第一步 ：意识到自己在拖延。是有对其他事情更强烈的欲望，还是对当前事情的厌恶。 第二步 ：可以考虑使用一系列心理工具来克服纠结阶段。如：告诉自己在做其他事情前，先花仅仅 5 分钟来尝试一下目前这项工作。 “一项任务让人不愉快之处（如果你厌恶它）或者另一项任务中令人愉快之处（如果你被分散注意力）实际上都是一种冲动，这种冲动不会持续太久。即使是相当不愉快的任务，如果你真的开始工作或无视强有力的干扰物，通常只需要几分钟，你会不再焦虑。( 1192)” 第三步 ：克服在开始之后因为感到不愉快而难以集中注意力的情况。 方法： 使用番茄钟（笔者个人觉得不好用，相当于在主观上添加了“时间”维度，反而更有可能分心） “当你仍然被先前的问题困扰时，不要转向一个更难的目标。( 1201)” 预测挫败感将会出现的时机，认识到这种挫败感造成的想要放弃只是一种冲动，然后设置一个小目标，比如再坚持一小会、完成下一个小部分等，坚持完成这个小目标，随后往往就能顺利推进。 第四步 ：有关长期规划，善用日历来充分利用时间，但必须要能真正遵循日程。若不能，则回到第一步培养这个习惯。 抗外界事物插入干扰的方法： 总的来说，要么放到一会再做，要么给当前的事务设置“断点” 有其他事务插入：设置类似“断点”，让自己在回到任务之后能够迅速进入状态继续 有些不必要立刻进行的工作，如扫描、保存文件等，做个开头作为“标记”，如新建个文件夹等，等最后再回过头来完成 “你无法控制你的厌恶或分心，但你可以通过练习减轻它们的影响。( 1214)” 2. 问题2：分心 1. 前置问题：什么样的专注最能保持下去 “当一项任务既不太难也不太容易时，心流则是一种介于无聊和安逸之间的愉快状态。( 1225)” 心流的状态最好，但是由于心流是“无意识”产生的，往往出现在熟练的任务中，因而在超级学习的过程中往往可遇不可求。 2. 前置问题 2：应该学习多长时间 “把学习内容安排在不同的时间段进行联系比把学习内容挤在一起联系能记住更多内容。 “类似地，交织学习现象表明，在你注意力高度集中时，从不同角度出发来学习你所关注的技能也能提高效率。( 1248)” （笔者：可能是随时间增长，注意力将逐渐涣散的原因） 这之中存在一个权衡：将整块时间分散到多个任务中获取的效率提升，与学习后期任务被分散导致的困难度提高之间的权衡。 一个参考：选一段能集中注意力的最长时间，将总时间按此分块，每块学习科目的不同方面。 3. 注意力干扰源 1. 环境 需要了解最适合自己的工作环境，并测试是否真的能提升效率。比如一边听音乐一边工作是真的能完成更多还是只是让工作更容易忍受，若是后者则需要小心。 2. 任务 强度更高的任务更难分心，对认知要求更少的任务则容易分心。因此可以对任务添加一些认知上的要求，比如读书时做笔记。 “为了更好地集中注意力，我会选择那些更直接（原则三）或更能提供反馈（原则六）的工具。( 1276)” 3. 大脑 e.g. 负面情绪、烦躁不安、百日梦等。解决方法是接纳这种情绪、告诉自己能感知到这种情绪而不是急着拒绝它，然后 “轻轻地把注意力转移到你的任务上，让这种情绪过去。( 1285)” 。和“正念”的概念类似。 “如果完全停下任务来回应情绪，在未来，你的情绪就会减弱。( 1285)” 即便在这样的时期完成的任务不多，但如果能坚持继续执行任务，就会提高对抗情绪的能力，对长期来讲是有益的。 3. 问题3：没有找到合适的专注点 这个问题指：对手头的任务要有要有多么专注比较合适 一个概念：兴奋度对注意力的影响： 高兴奋度提供高注意力，但时间可能较短；适合小目标，但不适合持续较长时间的任务。 复杂的任务收益于轻松的专注状态，从而获得更大而分散的专注的空间，从而有助于考虑到不同的情况或想法。 如果任务是特别有创造性的，不专注反而更有益。但不等于“懒惰”，而是那种一直留意但又不特意去想它的状态。 “休息一下有助于为解决难题带来新的视角。( 1321)” 因此，可以通过感受自己的兴奋度来选择执行合适的任务，或者反过来。上述是个基本参考，每个人有自己的一套标准。 如何提高专注力 1. 认清自己的水平； 2. 从小事做起，每次抗拒分心都会减轻分心的影响。 原则三：直接 指将学习理论与实际的使用情境或环境紧密连接起来。 然而通常情况下， “直接学习让我们感觉不适、无聊或聚散，所以我们单纯满足于一些图书、讲座或应用程序，并寄希望于它们最终能让我们学会某种技能。( 1391)” 直接学习的关键是“在使用中学习”。 间接学习：学习事实、概念和技能，而非应用。包括致力于学习高度理想化的问题以至于以后都很难遇到 例子：只听讲座来学习是很“间接”的，需要结合习题集来练习达到直接接触，不过在这之前也需要先吃透教材。 “直接学习原则认为，只有在你想习得的技能上进行大量实践时，你才会真正学懂、悟透。( 1418)” 如果不能做到“真的直接”，则选择那些接近的项目，以逐渐提高自我表现。 一个教育学概念：迁移 定义：将在一种环境中学到的东西在另一种环境中使用。（在机器学习中的相似概念应为“泛化能力”。） 知识有限时，迁移更难；学会更多的知识和技能时，就会更加灵活，也就更容易将其应用于其他项目。在此，作者指出，因为大多数正规学习都是间接性的，所以迁移很难发生。 ( 1480) 直接学习一方面缩短了学习内容与运用领域的距离，从而缩短了迁移的距离；另一方面与现实紧密联系，能够捕捉知识与现实之间微妙的相互作用的细节，或获取意外的技能（例如熟练掌握单词释义检索工具），从而更有助于借助现实环境实现迁移。 因此需要基于现实环境构建知识，将新事物与要使用它们的场景联系起来。 具体方法 1. 简单的方案 将大部分学习时间花在想做得更好的事情上。如果办不到，则需要人为创建一个项目或环境来检验该项技能。其中的重点是，试图掌握的技能的认知特征和练习的方式要基本上是相似的。随后，在这个基础上逐渐加深知识的深度，从而能更灵活地达成迁移。 即便是非常抽象的任务，如“获取对 XX 科目的深入理解，也可以具象到一个应用场景中，比如目标设定为能与人以此为话题进行交流，所以多尝试进行语言输出、算法推导等。 迁移问题是否出现的检查方案：询问自己： “...问问自己你要将知识运用到哪里、如何运用。回答完这个问题，再可以问自己，你是否采取了实际行动，来把你所学到的知识与其应用环境联系起来。( 1582)” （从机器学习的角度来理解，训练集需要有较高的质量以反映标签。） 直接学习更有挑战性、更容易让人有挫败感，但收获也是无可比拟的。 2. 一些策略 1. 基于项目的学习 选择项目而不是课程来学习需要的技能。需要能看到一个成果。 2. 沉浸式学习 即将自己置身于目标环境中。例子：语言学习、社团、程序开源项目等。 3. 模拟器 即仿真模拟，适用于难以进行沉浸、直接化的项目。 理论：直接学习的关键不在于环境特征，而在于学习者的“认知特征”：在某些情况下应该做出什么样的行为。 4. 增加难度 可以考虑尝试一开始就一定量地提高难度，从而更容易地暴露项目特殊点，获得更尖锐的反馈，获取更重要的教训。 原则四：训练 学习的过程中会在某些方面形成“瓶颈”，控制熟练掌握整理技能的速度。 因此，反复训练的策略即是： “在学习中确定一个限速步骤，将它分离出来，并对它进行专门训练，因为它支配着你在该技能上的整体能力。( 1644)” 针对性训练相比于整体训练的优势：能避开学习陷阱，即为了提高在某一方面的表现而在此投入过多注意力，导致在其他方面的表现开始下滑，而评估又是基于整体的，因此导致进步慢下来。 和原则三的冲突的解决 先直接学习，后反复训练。把直接学习和反复训练看作一个更大周期中的交替阶段。 1. 第一步先尝试直接练习，弄清楚技能何处使用，怎么使用，在练习时尽量接近实际情况； 2. 分析直接技能，尝试分理出限速步骤环节或难以改进的子技能； 3. 最后回到直接学习中整合，从而及时反馈发现问题。之后再在直接学习和反复训练中往返。 越往后，花在反复训练的时间可能越多，因为难度会随之提高。 执行时需要注意的策略或难点 1. 弄清楚什么时候训练什么 不确定是不是限速步骤的时候，可以先试一试 2. 设计出能够提高技能的训练项目 3. 反复训练很艰难且令人不快，因此有一些策略 1. 切段练习 2. 将任务的认知成分提取出来，例如“语言”任务中的声调 3. 模仿、复制那些非重点练习的部分来减轻不得不整体练习时产生的认知负担 4. 在子技能上投入更多的时间 5. 碰到需要练习的前置内容再去练习，而非一开始就学习前置内容，从而节省时间 4. 不要花太多时间在已经熟练/感兴趣的部分，要勇于练习那些自己还不熟悉的部分，并克服练习过程中产生的不适感、挫败感。在这过程中要把学习看成是自己主导而非外界环境强加的内容，从而尝试找到乐于学习的角度。 原则五：检索 这里指的是试着不急着看课本而从大脑记忆中没有提示地去回忆事实和概念。 回忆检索型的练习比被动学习（看书来复习）能提供有效的长期记忆。 且无论对内容掌握了多少，这种检索型的练习都能生效，且可以和查找答案的能力结合起来。 可行性理论：R. A. Bjork 的“可取的困难”： “只要检索行为的方向是对的，越艰难的检索会带来越好的学习效果。( 1824)” 效果好坏：自由回忆 ＞ 线索回忆 ＞ 识别测试（多项选择） 在准备好之前就进行自我测试是更有效率的 对于新学会的知识，将第一次测试时间推迟一下比学完马上测试要好 一个有趣的现象 前向测试效应：检索不仅有助于巩固，还有助于为学习做好准备。对以前学习过的信息进行定期测试可以使学习新信息变得更容易 应该检索什么 “总有一些事情，你要选择去掌握，而另一些事情，在需要的时候你可以马上查得到，这就足矣。( 1865)” 方法：直接法 + 广且多的被动接触 和直接法联系起来：直接法能迫使你去检索在实际应用过程中经常出现的问题。所以可以直接进行实践。 该方法能自动检索高频知识点。但也有一个缺点：如果知识库不足，对能够解决问题的知识毫无概念，则检索也无从谈起。仅仅使用该方法会忽略掉可以帮助解决问题但严格讲有不必要的知识，因此需要结合广泛的被动接触来提升原有知识库的广度。 练习检索的策略 1. 记忆卡 主要缺点：只对特定线索和特定答案配队时的检索非常有效。应用环境极其多变时，就存在缺陷。 2. 自由回忆 在完成一次学习后，试着把能记住的所有东西都写在一张白纸上。 3. 问题集 和记笔记的一种策略相关：把记下来的内容重新表述成问题，待会再回答，从而获得练习检索的资料。不要把重点放在无关紧要的问题上，不要事无巨细，提一些具有思考深度的问题。其中一个方法是每个章节只允许问一个问题。 4. 自创挑战 创建挑战性问题，比如将课上学到的理论和如何应用于实践联系起来，然后找一个例子，甚至实现这个例子，例如编程领域的学习。 5. 闭卷学习 切断寻找提示的可能，减少查阅资料的冲动，多依靠自己的回忆。 原则六：反馈 超级学习方法的反馈即时、准确性高、强度大。 克服恐惧 “有时候，最好的行动就是直接处理最困难的情况，因为即使最初的反馈是非常消极的，它也有助于减少你开始一个项目的恐惧。( 2009)” 要学会能够拥抱重大打击性反馈，并从中汲取信息。“一旦你养成了接受反馈的西馆，处理反馈就会变得更容易，你就不会在情绪上过度反应。( 2155)” 有效地处理反馈 “...对一个人的表现获取即时反馈的能力是达到专家水平的一个重要因素。( 1970)” 反馈重点不在于量，而在于类型，必须要能提供有用的信息来指导未来的学习，而非针对个人的评价。要建设性地使用反馈，对真正有用的反馈非常敏感，而忽略其他的反馈（例如和个人方向完全冲突的反馈），且无论对积极反馈还是消极反馈都不反应过度。 另外， “...由谁提供反馈信息也很重要，来自同伴或老师的反馈具有强大的社会动力。( 1992)” 什么样的反馈是好的 不应该先验地固定“学习项目需要什么样的反馈”，而是考虑所有类型的反馈后再思考如何采取意见。 强调的三种类型的反馈： 结果反馈 影响最小的一种，只会针对整体好坏做出反馈，而无针对其中部分的信息。但也是有帮助的，这意味着可以对项目进行很轻松的更改变动。这种反馈能提供激励基准从而更新进度，也能展示正在尝试的不同方法的优点。 信息反馈 告知做错了什么，但不一定会说明如何改正，即结果反馈从整体作用到部分上。当能实时访问反馈源时，经常获得这样的反馈（例如程序报错）。在直接法中也有体现，即和环境的互动中。 纠正性反馈 “‘对接受反馈的学生来说，最好的反馈是信息丰富且有针对性的建设性意见的。’( 2062)”这种反馈常常需要找到一位老师，且这样的努力是非常值得的。而且这种反馈也能很大程度上不同消除信息反馈中可能遇到的矛盾性。 特别的几点 并非所有弱反馈到强反馈都是好的，特别是反馈的有效、准确性因此降低时； 反馈的一致性很有用； 即时反馈相比于延迟反馈更好，且和延迟第一次检索的做法可以相容，即“即时的反馈最好与延迟的复习（或进一步的测试）相结合来增强记忆( 2097)”，但要注意保证反馈的可靠性，即要尽全力回答问题或解决难题后再寻求反馈； 反馈不能太快，否则会变成被动复习； 只有能记住教训时，反馈才是有用的。 如何改进反馈 几个策略 1. 消除噪声 修改和选择所关注的反馈流来消除噪声，减少无用信息。可以选择“代理信号”，即侧面的反馈。 2. 达到最佳难度点 “只有当反馈结果很难预测时，收到反馈才能为你的改进提供更多的信息。( 2124)”要警惕一直顺遂的反馈，类比于信息论中难以预测的事件提供的信息量才多。“基本上，应该尽量避免那些总是让你对自己的表现感觉良好（或不好）的情况。( 2128)” 3. 元反馈 定义：评估学习的策略的整体成功程度。重要形式：学习速度，技能提升的速度。应用情景：当学习速度太低时考虑更换策略，或比较不同策略之间的效果。 4. 高强度、快速反馈 意见越丰富越好，反馈次数越多越好，且尽量适应、消除其中情绪化的影响。 原则七：记忆 “‘记忆是思考的灰烬。’——Daniel Willingham，认知心理学家( 2161)” 遗忘的原理 三种主要理论：衰退（时间因素）、干扰（竞争和覆写，前摄和后摄）、遗忘（只是难以获取，线索断裂） “记忆的行为不是一个被动的过程。在回忆事实、事件或知识时，我们参与了一个创造性的重建过程。记忆本身在记忆过程中经常被修改、增强或操作。通过新的线索找回的‘失去的’记忆实际上可能是捏造的。( 2294)” → 《齐马蓝》记忆的易变性 如何不遗忘 两个挑战：短期的：如何不学了就忘；长期的：如何能持久记忆 每个人用来记忆的系统不同，但都有一些共同的机制： 1. 间隔 重复学习系统（SRS） 将学习内容划分成小段：比方：在 10 天内每天学习 1h 强于 1 天内一次性学习 10h。在这之间找到一个合适的平衡点 SRS 不适用于需要理解的、有复杂信息关联的知识，因为这些知识需要通过真正操作来建立记忆和联系。SRS 对扩展记忆，特别是一一对应的记忆有效。 类似的做法：对技能进行半规律、半定期的练习。适用于更复杂、更难融入日常的技能。 2. 程序化：自动持久 “程序性技能，如你永远记得怎么骑自行车，比需要外显回忆才能检索的知识更不容易被遗忘。( 2352)” 一个理论：大多数技能都是阶段性的，一开始是说明性，随着练习增多最终会变成程序性的。 一般情况下，不会均衡地学习大量知识或技能，而是会更频繁地强调一组核心信息，从而让其程序化，储存时间更长。大多数技能都不是完全程序化的，其中一部分能自动完成，但另外的需要从大脑中主动搜寻。 一个方法：花费一定精力，使一些技能程序化，把这个技能作为其他知识的索引。 3. 精益求精：熟能生巧，超越完美 额外的练习可以增加记忆储存的时长，即便正确了也继续重复。可与前两条结合。 两种策略：不断练习完善某个技能的核心部分，或者提高技能的等级，自然而然地在将较低级技能的核心部分应用到高级时达成精益求精。 与直接学习匹配：直接学习往往涉及对某些核心能力的过度练习。 4. 助记法：一图胜千言 有很多方法。e.g. 关键字法。但助记法并不是关键，只能作为困难信息或紧急情况的记忆桥梁。前期投入较大，在实际中应用窄，且不如直接记忆自动。 原则八：直觉 “只有不断解决问题，积累了足够的经验，你才能建立起一个深层思维模型。直觉听起来很神奇，但其实可能很老套——它是有条理地处理了大量问题后的经验产物。( 2534)”“...通过广泛的具体环境实践以成为专家...( 2562)” 建立起巨大的“心理表征库” “...把重点放在原理上，以例子为基础，直接切入问题核心，而不是只关注表面特征。( 2551)”而切入核心的能力，在于有一个庞大的模式库。 笔者：这里的“直觉”应该不是指“拍脑袋决策”的那种“直觉”，而应该解释成对熟悉事物的相当高的敏感度。在真正工作或决策的时候还需要小心前者。 培养直觉 花大量时间学习 ≠ 能产生深刻直觉 培养直觉的几个规则： 1. 不要轻易放弃难题 达成“不轻易放弃”的具体技巧：设定一个“计时器”，想要放弃且不可能找到解决难题的方法时，再计时 10 分钟，让自己再努力一会。 两个优点：有足够的时间思考；找到解决方法时更容易记住这个方法。 2. 通过证明来理解 不是单纯的理解，而是要融入推导的过程，有助于培养直觉。在这期间不直接阅读他人的推导过程来理解结论，而是先自己深入思考。不要陷入“边阅读边点头赞同”的简单理解的陷阱（“解释性深度错觉”）。 “这种以为自己已经理解了的错觉常常是学习更深层次知识的障碍，因为除非对这种能力进行实际测试，否则你很容易误导自己，以为自己理解得更多。( 2612)” 3. 总是从具体的例子开始 “迁移研究表明，大多数人是在接触了许多具体的例子后才学会抽象的一般规则的。( 2620)” 处理水平效应（levels of processing effect）：决定信息被记住的，不仅仅是所花的时间，更重要的是如何思考这些信息的。 针对问题构思具体实例，可以利用反馈来测试自己是否真的理解。 “...如果你无法想出一个合适的例子，那就说明你对某些东西理解得不够好...( 2634)” 4. 不要欺骗自己 邓宁 克鲁格效应：当缺乏某一学科的知识时，往往也缺乏在这个学科上正确评估自己的能力。 避免的方法：问很多问题，甚至是简单、愚蠢的问题。 作者的发明：费曼技巧( 2659) 用于消除解释性深度错觉。 操作方法： 1. 在一张纸的顶部写下想要理解的概念或问题。 2. 在下方解释这个想法，就像想要说服别人理解这个想法一样：如果是一个概念，思考如何把这个概念传达给以前从未听说过的人；如果是一个问题，思考如何解释它，重要的是解释自己是怎么理解解答步骤的。 3. 当过程失败时，参考答案。 应用： 1. 完全不理解的东西 在自己的解释和书中的解释之间来回切换。 2. 似乎不能解决的问题（难题） 在解释问题的同时一步步分析问题，不轻易做总结，因为总结容易跳过问题的核心难点。 3. 非常重要的概念 应用于非常重要的概念来扩展直觉，把注意力集中在生成一些例子、类推或可视化学习中。想象有人付薪水来解释概念。 原则九：试验 假设、实验、结果、重复。实验不一定要成功才有价值。多样性、高强度。 “新手和大师级程序员之间的区别通常不在于新手不能解决某些问题，而是大师们知道如何使用最佳方法，最有效、最干净地、没有任何后续麻烦地解决问题。( 2812)” 在这过程中需要选择性地遗忘陈旧无效的方法。 实验可以找到初期的感觉、突破停滞期、找到独创性。 三种类型的试验 1. 资源试验 学习方法、材料和资源。试验冲动需要有与之相当的付出，最后能回过头来选择一个比较好的资源。 2. 技能试验 “接下来我应该学什么”，是资源选择的下一步选择。 3. 风格试验 在如何做某事上尝试不同的可能性。关键是要了解现行的所有不同风格，而不是一开始就盲目地试。 试验的心态 “试验基于这样一种信念，即你能够改进你的学习方法。如果你认为你的学习风格试固定不辩的，或者你认为自己具有某些不可改变的优点和缺点，这将阻止你去尝试不同的方法来获得技能，你将根本无法进行尝试。( 2860)” “成长型思维模式鼓励你看到改进的机会和潜力，试验则执行某项计划来实现改进结果。( 2863)” 如何试验 先了解自己的问题，然后想出方法来解决。 一些策略： 1. 模仿，然后创造 提供了一个立足点。而且在模仿时会有解构的过程，从而发现原理，甚至推翻自己以前的猜想。 2. 平行比较各种方法 可应用控制变量法、分割测试。 3. 引入新的约束 “学习的最初挑战在于你不知道该做什么，学习的最终挑战在于你认为自己已经知道该做什么。( 2894)” 引入新的约束条件，使旧方法失效，摆脱惯性思维，激励自己探索不太熟悉的选项，发掘潜力。 “最了不起的创新来自约束和限制...( 2898)” 4. 探索不相关的技能 对于创造性或专业技能的领域，将两种不一定重叠的技能结合起来，从而获得相比于专攻的明显优势。跨越多个超级学习项目，协同增效。 5. 探索极端 “技能领域越复杂，包含的维度越多，技能的应用范围就越大，而这些应用至少跨越了其中一个维度。( 2919)” 不要囿于中庸之道，尝试把正在培养的技能的某些方面发挥到极致，从而搜索尽可能广的可能性空间。 试验具有不确定性 “试验会帮助你在方法上的细微差异中做出决定，而这些差异是没有一份原则列表可以详尽涵盖的。( 2930)” 无论对于学习的项目，还是学习本身都是如此。 其他 后面的章节的内容： 本书提供了手把手教学开启第一个超级学习项目的方法，涵盖以上原则，且提供了具体的操作细节。 超级学习的两种主要替代策略：低强度习惯（随时间自然积累）和正规的系统教育。 “当学习过程主要是积累、增加新技能和知识时，学习习惯往往能发挥最佳作用。如果完善某一领域需要摒弃无效的行为或技能，超级学习和有针对性的努力更适合。( 3136)” 特别是后者有助于克服挫败感。 正规系统教育也可以看成是一种资源，特别是沉浸式的有专家参与的那种学习氛围，所以不能单纯地看作是过时的方案。 本书还提供了对小孩子的超级学习的比较非常规的培养方法，以及作为教育者对学习者制定方案的建议 本书附有作者自己的一些超级学习项目的说明 本书最后提供了一个可供填空的操作手册"},{"title":"Between Two Worlds (Let's Lament) - Mili","url":"/reports/240220t/","category":"👓 观阅闻后感","tags":["音乐"],"text":"Between Two Worlds (Let's Lament) Mili 查到是《边狱公司》第三章插曲。只有钢琴伴奏，且即便如此 Mili 的歌声表现也相当令人满意。 而且这首曲子的一个特点是：无论单独拎出哪一个来情感表达都很完整，人声和琴音相得益彰。笔者在听的时候甚至觉得可以把人声看作是钢琴的注解，而非传统的伴奏只是个辅佐，相当新奇。 歌词 Ooh 哦 It's this time of the year 一年一度的这个时节再次到来 A very so merry night we hold dear ( 05:08) 我们最珍爱的这个无比欢乐的夜晚 So many, so many regrets bring me to tears 好多好多懊悔催我落泪 Not many, not many notice nor care 好少好少人留意或在乎 Ooh 哦 My saviour 我的救世主 Ooh 哦 Why does a common fire hold so much power? 为何赐予平凡的火焰如此强大的破坏力？ If only we could be forever naive and pure ( 04:02) 但愿我们永远单纯天真 If only we could lead painless futures 但愿我们的未来无痛无苦 If only there could be a forgiving world 但愿世界怀有慈悲 Maybe, maybe that was when 可能就是那个时候 I chose to stay fallen ( 03:01) 我选择从此持续堕落 Lights 道道光芒 A star 一颗星星 A voice 一句轻语 A twisted thought 一丝扭曲的思想 A touch 一份感触 A kiss 一个吻 A distorted dream 一场歪曲的梦 Ripples 层层波浪 A well 一口井 A stone 一块石头 A multiplying desire 一股无尽繁殖的欲望 A fruit 一颗果实 A sin 一项罪恶 A holy mother 一位圣母 I'm infected, I'm infected 我也被感染，我已被感染 You have invaded and re created me ( 02:03) 你侵入于我，将我重造 Ste 德，但这东西个人的尚不可靠，遑论群体。所以，要想从根本解决，重担最后还是落在了制度制定者的肩上。当然，有抱负的个人可以通过爬上高位来获得推翻这一切的权力，但这就是另一码事了。"},{"title":"崩坏：星穹铁道文摘","url":"/extract/240218s/","category":"✒️ 摘抄本","tags":["游戏"],"text":"一些有趣的、一些哲理的、一些有文学性的。 1. 《再见黑塔》，“致：黯淡星”任务后洛奇·马丁内斯的诗作 黑暗在远方列队。用近乎残忍的方式 解剖着时间。询问爱情的花瓣俯下嘴唇 如同无限时空中、滴答的钟声。我们别无选择 只能滑入宇宙那不详的颤抖，如同划下一道黄昏的斜坡 就这样，群星依旧在头顶赏乐，沿途将是它们优雅的倦容。 ——洛奇·马丁内斯 2. “朋克洛德精神”黑塔空间站银狼同行任务 她开始奔跑起来，穿过霓虹，越过氖光，恰如她离开故乡，奔向群星的那个晚上。 星光拉长她的影子，照亮朋克洛德的历史，那些书写下传奇的人们，它们的誓言被星空所铭记—— 最初的「角色扮演玩家」说，游戏是为了成长。 冷静的「战术策略玩家」说，游戏是为了胜利。 叛逆的「多人协作玩家」说，游戏是为了邂逅。 慈爱的「文字叙事玩家」说，游戏是为了铭记。 而今，年轻的「银河冒险玩家」，她这么说道—— 游戏就只是为了游戏，仅此而已！ 3. 仙舟罗浮的青镞 “经文并没有什么蛊惑人心的力量，人们从来只是自己蛊惑自己，而经文给了他们谎言和虚假的希望。” 4. 对莫里斯——皮诺康尼“黄金的时刻”忧郁青年——的形容 眼前这男人好似一株刚淋过雨的香菇——奇妙的比喻，你大概是饿了——扎根于潮乎乎的颓丧，披戴着湿漉漉的愁苦。 5. “好人难寻”皮诺康尼冒险任务 “通往暴君之路，并不需要残暴的灵魂，只需要一颗软弱的心。” 6. 三月七同行任务 “人心总是追求合理，拼拼凑凑便把不相干的东西组成了一出看起来有意义的幻戏故事，取名人生。” \\ “苦的，不好喝。” \\ “苦的才对身体好啊！” \\ “可是苦的就是苦的啊！骗自己吃苦有好处，这不过是一种自我催眠罢了！” 7. 金人巷寿考堂门口 在仙舟的幻戏中，有太多大侠吃下药丸脱胎换骨，力大无穷。 「药丸」拯救的并不是病人，是无计可施的编剧。 8. 惠特克爵士 \\ 你还没说对这项工程的看法。 \\ 我的评价？符合预期。 等到这座城区结束施工，真正向逐梦客开放的那天，围绕它的评价将是这般—— ——小部分盲目吹捧的拥趸将会被舆论攻击；小部分等待口碑反噬的看客会开始狂欢。而对于其他人——也是占到百分之九十的大多数而言——他们不会在乎。 他们会来到这里，继续消费、享乐。他们从来不在乎所谓的精益求精，他们需要的只是某种程度上的新鲜感。 7分是个合理的评价，符合家族的需求，也符合奇迹本杰明当下的水准。班尼或许会极力否认……但这就是无可辩驳的事实。 9. 科琳 \\ 话说回来，这个故事够浪漫吗？ \\ 有种波澜壮阔的美。 \\ 是吧？相比于爱情，我更喜欢这种不寻常的浪漫。 银河中有亿万颗恒星，在如此广大的尺度上，二人间的执念难免显得渺小。 总之，你能喜欢它真是再好不过了。 10. 格 蕾 “深陷战争的人们总会祈求和平，希望有什么东西来拯救自己。 “那东西可以是奇迹、是伟人、是远在天外的星神，甚至是…强大到足以终结战争的武器。 “遗憾的是，人类永远不会满足于手头的武器。战争结束后，他们依旧会索求更大、更强的武器，直到玩火自焚，把视线所及的一切都烧成灰烬。”"},{"title":"热红酒","url":"/learning/240205m/","category":"💡 知识库","tags":["食谱"],"text":"教程来源 ：【冬天必做的果香热红酒方子来了！用这份暖洋洋的甜美馨香迎接美好的节日季】 Bilibili 网 主厨广坦 自己把家里觉得酸涩难喝的红酒拿来实验，去掉了教程中放的香料，最终成品醇厚利口，蜂蜜、红酒、水果诸香俱全。所以说是一种拯救难喝的红酒的好办法。 1. 将以下材料倒入煮锅中： 半瓶红酒 一个苹果切瓣 一个橙子切片 两勺蜂蜜 两勺白糖 2. 开火保持红酒微微冒泡，慢煮 30 分钟； 3. 将水果夹出，盛出酒液即可饮用。 注意事项： 红酒提供最终成品中的酸味，蜂蜜和白糖提供最终成品中的甜味。所以如果不想太酸就不要吝啬放蜂蜜或白糖。 煮出来的水果算是副产物（即“酒渍水果”），也很好吃。放水果的量可以自己把握。 有条件可以过滤，若想获得澄清酒液需要用滤纸过滤。 配一张煮制过程的图："},{"title":"adios - JAWNY","url":"/reports/240128s/","category":"👓 观阅闻后感","tags":["音乐"],"text":"adios 与状态异常之间的关联 糟糕的睡眠与心理状态异常，如情绪低落、欲望低下、压力敏感、无意识犯错、专注力下降、记忆力下降、内分泌失调、新陈代谢减弱（代谢过慢导致肥胖）、难以消除的疲惫感、肠胃疾病、皮肤糟糕等。 “情绪问题没有解决门径的时候，先解决容易解决的睡眠问题，就成了我们最理智的选择了。” REM 阶段有助于清理压力并调整压力应对。 睡眠质量糟糕会导致乳酸积聚，乳酸可对身体末端产生刺激，生成疲惫感。 同时，也会导致 β 样淀粉蛋白积聚，作为神经毒素降低应激能力。 缺乏睡眠会导致前额顶叶负担认知任务，而原先负责注意力的网络活性减少，前额皮质执行力减弱，引起专注力下降。 睡眠可制造大脑需要的含氧化合物，帮助巩固记忆。 REM 阶段睡眠短缺会对记忆造成巨大危害。 睡眠与内分泌：生长激素（23 3 点↑）、肾上腺皮质分泌类固醇（紊乱则会导致失眠）、副甲状腺素、褪黑素、甲状腺激素 茶可提高代谢，缓解熬夜负担。 熬夜会导致分泌大量饥饿素（荷尔蒙？），产生进食欲望。脂肪代谢也会异常。 新陈代谢也会影响皮质醇分泌，皮质醇失衡会让负责饥饿的荷尔蒙大量分泌，使人对饥饿产生误判。 睡眠异常导致的代谢异常可能会导向肥胖症或糖尿病。 补觉无效：代谢紊乱。 日常疲惫感可能的成因：饮食（血糖波动）、水分摄入不足、睡前运动。 支配消化系统的神经：迷走神经。 睡眠↓：迷走神经兴奋性↑：胃酸分泌↑+肾上腺皮质激素↑：胃酸、胃蛋白↑+胃部血流量↓：胃黏膜变薄：胃部自我修复能力↓：肠胃疾病 胃部不好可以尝试侧卧，降低高枕带来的腹腔压力。 趴在桌子上午睡会给胃部施加压力。 睡眠不足对皮肤的影响：缺水（角质层代谢故障）、毛孔粗大（油脂分泌、代谢异常）、黑眼圈（血液堆积）、水肿（代谢无法清除疲劳带来的废物堆积）、痘痘和粉刺。 皮肤最佳休息时间：22:00 02:00 睡前皮肤保养好习惯：禁夜宵、仰卧、禁酒、勤换洗床单（每周） \\ 睡眠医学在国际上对睡眠问题的划分：失眠、异态睡眠、睡眠相关呼吸障碍、昼夜节律的睡眠觉醒障碍、过度嗜睡的中枢障碍、睡眠相关运动障碍 怎样的睡眠才算好 身体通过淋巴系统排毒，大脑则通过脑脊液排毒。通过慢波睡眠（SWS）和快速眼动睡眠（REM）的交替来完成。 信息传入大脑的两条途径： 原始脑：丘脑 → 杏核仁（快、信息少） 理性脑：丘脑 → 扣带回 → 大脑各区域相应皮质 → 杏核仁 原始脑无自控力，使人倾向于熬夜以获得更多娱乐。提高理性脑的自控力，需要提高理性脑的“能量基准”，而能量基准其中一个补充来源就是睡眠，因此存在闭环。 入睡后，T 淋巴细胞和 B 淋巴细胞的数量都会上升，意味着免疫系统加强。 什么样的睡眠是好睡眠？ 看起床后的状态，是否能快速进入一天；是否能自动醒来（不依靠闹钟）；是否能快速入睡（5 min） \\ 减少不睡觉时躺在床上的时间有助于提高睡眠质量。 梦境：弗洛伊德《梦的解析》：“梦起源于人的主观意愿，其目的在于满足人的意愿。” 80% 的梦境在 REM 期发生。 睡眠影响梦境：多梦的成因：睡眠环境改变、睡眠规律颠倒（996）、心理压力大、病痛、负面情绪、不良生活习惯、身体疲劳。 多梦会影响睡眠质量，需要调节情绪和生活习惯。 失眠有一些表现：入眠困难、多梦、惊醒、晨起后难以进入状态、白天嗜睡等。但总归是一种主观认知：失眠者对睡眠质量、睡眠时间不满意，并由此影响正常生活。 失眠原因：外部环境糟糕、身体疾病、精神心理因素、药物刺激、对失眠本身的恐惧。 营造良好睡眠环境：避免突然的声音干扰、避光、卫生、不要挨饿或过饱、睡前停止思考问题。 安眠药：研究表明，绝大部分安眠药只是平均让入眠时间缩短了 10 min，安眠药会让人在睡眠时间失忆，从而忘记睡眠情况，并不意味睡眠质量真的提高了。 安眠药会带来副作用、依赖性。所有药品都需要谨遵医嘱服用。 失眠主要靠自愈。“魂”要守在“舍”内，失眠时，要么“魂”出了问题（心理精神、压力等），要么“舍”出了问题（环境、身体生理健康异常等）。 \\ 匹兹堡睡眠质量指数（PSQI） \\ 失眠可能由血压较高引起 如去医院，挂神经内科。 可能引起失眠的药物（谨遵医嘱）：补品或保健品（睡前）、抗高血压药、健脑益智类药（吡拉西坦，GABA 的衍生品）、抗心律失常药（奎尼丁、丙吡胺、普鲁卡因胺等）、平喘类药物（氨茶碱、麻黄碱）、糖皮质激素（泼尼松、地塞米松、甲泼尼龙等）、胃药（铋）、抗结核药品（异烟肼）、利尿剂、抗抑郁类药品。 继发性失眠：精神、躯体疾病（及药物滥用）继而引起的失眠。疾病治疗结束之后，失眠症状随之消失（共病性失眠：和病症一起出现的失眠症状） 原发性失眠：不受其他疾病的影响。分为心理性失眠、主观性失眠和特发性失眠。 原发：焦躁、压力过大、起夜多梦惊醒、无与睡眠相关疾病、盲目服药、主观性失眠诉求（睡着到打呼噜了，醒来却坚称自己没睡） 继发性更好治疗，原发性要考虑及时就医。 睡着 ≠ 睡好 判断睡眠质量好坏标准：第二天的精神状态。 睡眠质量和睡眠时长无直接关系；睡眠时间过长，“睡眠神经”就会过度活跃。 睡眠的阶段性障碍： 梦呓：睡眠过程中出现打鼾之外的声音，且醒来后不能回忆。劳累过度、精神压力过大。梦呓出现在深睡阶段，因此会影响睡眠质量。 睡行症：即梦游，醒来后不能回忆。常发生在深睡阶段，儿童比成人多，男比女多。发生梦游时不能强行唤起，否则会导致躁动激动、记忆力障碍等。需要及时就医。 梦魇：即“鬼压床”，肌肉神经尚未苏醒，但神智已经清晰。多为体力劳动过重或者大脑皮层高度紧张。只需有人在旁唤醒即可，非严重现象。 “回笼觉”是无效的，必须保证晚上早睡，避免晚间睡眠节奏被打乱导致的睡眠质量下降。这样造成的疲劳会累积。 广东省中医院心理睡眠科：最佳睡眠时间 21:00 05:00；本书笔者：合适的睡眠时间：23:00 前睡，06:00 左右醒。 人体睡眠一般 2 h 一个周期。每个周期有 5 个阶段：入睡， 10 min；浅睡， 20 min，容易自行惊醒；中睡， 40 min，不容易自己醒来；深睡， 20 min。REM，5 10 min，眼动约 50 60次/min。 播放以水声为主要旋律的音乐有助于睡眠。班得瑞音乐。鱼缸。不适用于对声音非常敏感的人。 醒来后继续躺卧则导致更不容易清醒。 快速转入清醒状态的几种方法： 耳朵拉伸法：捏住耳垂向下拉 3 秒钟，然后轻轻揉搓耳朵，从而促进血液循环。原理：耳朵较薄且敏感，有助于刺激的传达。 阳光利用法：醒来后照射阳光，早上用餐时在窗边等。 拉伸或体操：醒来后做一些拉伸来帮助唤醒肌肉。如日本的“猫式伸展操”。 左右脑轮休。长时间聚精会神做同一件事情，会对大脑造成过量伤害。 左脑逻辑思维记忆语言推理分析五感，右脑情感艺术直觉协调想象灵感。左右脑工作交替进行可以放松大脑。 如何获得更好睡眠 洗澡会让体温升高，擦干则会释放更多热量，造成神经兴奋。 洗澡最好安排在饭后 1.5 h 到睡前 1 h 之间，同时头发也要吹干。 水温尽量不要超过 40 ℃，虽然能消除疲劳但是消耗的热量也会随水温升高而上升（造成神经兴奋？）。三伏天的水温也不要低于 35 ℃。 长时间泡澡会加重疲劳感，20 min 左右为宜。 失眠可尝试将上半身调高 15°，但最终要慢慢适应平躺，否则还是会产生不良后果。 不同睡姿：仰卧（缓解腰背疼痛，但容易对咽喉部造成挤压，产生打鼾、流涎）、左侧卧（可缓解胃部不适，但心脏、脑血管不好以及中老年人不适用，易家中心脏负担）、右侧卧（降低血压、稳定心跳，但发育期的长期右侧卧易造成左右脸部不对称）、蜷缩（驼背、肌肉拉伤，还可能阻碍呼吸）、趴卧（最不健康，脊柱弯曲甚至错位，也会造成身体疼痛、肩颈僵硬、肌肉酸痛等） 颈椎病、腰椎间盘突出、食管疾病建议仰卧。 腰背痛、高血压、鼻中隔偏曲及鼻息肉、中耳炎建议侧卧。 胃病建议左侧卧。 冠心病建议右侧卧。 将床的作用单一化，只用来睡觉。 还可以进一步到熄灯即睡觉。两者的原理都是建立一种反射。 适眠温度：最适合睡眠的温度：20 23 ℃。 被窝里的温度在 32 34 ℃ 时最容易入睡。 \\ 流感爆发大多是因为室内湿度较低。 室内空气湿度应在 40% 80% 之间。太低容易让灰尘附在黏膜上，让人容易咳醒；湿度过大会导致恶心疲倦，也容易滋生细菌。 被窝相对湿度在 55% 左右最佳。 被子厚一点更好。更有安全感、降低大脑兴奋感（降低皮质醇水平）、有助于提高血；清素和褪黑素的分泌（前者是调控人体睡眠循环的重要神经递质，后者是使人入睡、熟睡的重要激素，21:00 08:00 分泌）。 加重的毯子一直被用来治疗儿童发育障碍和儿童自闭症，即“深接触压力疗法”。但被子也不宜太重，会压迫到胸部。 光神经蛋白：光与入眠之间的关系。 最理想的卧室光线亮度：20 烛光的亮度。 太暗也会带来恐惧效应，干扰大脑睡眠，使警惕性高于睡意。 蓝光也会让人难以入睡，夜间使用还会造成视力下降。 必须在夜间工作，则应该开灯，或者佩戴橙色眼镜。 在白噪音频率下更容易快速入睡。 白噪音：频率均匀分布在可听范围内的一种声音。如细雨声、微风声、海浪声、鸟鸣声。 有色噪声：与白噪音相反。 本质：遮蔽效应，可忽略嘈杂的环境，避免突然的声音刺激。 听熟悉的音乐、舒缓的中低频音乐能有效助眠。 \\ 人的脑电波划分：γ 波（30 80 Hz）、β 波（14 30 Hz）、α 波（8 13 Hz）、θ 波（4 7 Hz）、δ 波（1 3 Hz）。 \\ 高频音乐下，女性更容易失眠（对婴儿啼哭更敏感）。 如何听：播放 30 min 以内；声音要调得更低，45 dB，夜深时 30 dB。 不要使用耳机：异物感以及耳机线缠绕窒息。 裸睡更利于身体降温，从而更容易入睡。同时，裸睡也会让被子保温保湿，产生催眠效果。皮肤直接与空气接触，也有利于血液循环。 但要保证卫生，也要保证室温。个人实践中保证室温比穿睡衣更难。总体因人而异。 更好的睡具：更大的床（肩宽 2.5 3 倍）、避免太软（拒绝弹簧床和沙发床，最有利的是加了 5 10 cm 软垫的硬板床，但不能睡光板床）、拒绝异形床（长方形是睡眠潜意识中最为平和的形状(?)，形制、颜色要比较简洁） 摆放：床头靠墙，床头上方不要安装东西，不要摆在卫生间门口或房梁下方(?)，床头床尾不要对着电视电脑，空调设置在远离床铺的斜上方，睡床两侧留出通道，自南朝北尽量不要东西向摆放(?)。 光板床会导致腰部悬空，腰部肌肉无法放松，背部血液循环中断，久而久之腰椎变形。 选择稍硬一些且能和身体曲线贴合的床垫。后腰、臀部和大腿中间这两个地方不要悬空。仰卧侧卧都是。平躺时可以让腰椎保持正常曲度，侧卧时可以避免腰椎侧弯。 午休，30 min 足够。《皇帝内经》：“阳气尽则卧，阴气尽则寤。” 午休最好不要趴在桌子上睡，对胃和颈椎不好。 枕头选择： 高度：仰卧时与身体保持水平，通常为一拳；侧卧时略高，约一拳半。 “高下尺寸，令侧卧恰与肩平，即仰卧亦觉安舒。”一般 10 15 cm 就合适。 大小：要能托着脖子，比肩膀宽一点。 软硬：适中，不能太硬太软（难以保持高度） 填充物：散热要好。蚕丝、荞麦、决明子、乳胶等。 形状：传统扁平形。 关于制作药枕：简单实用的方法：荞麦壳枕头（装入枕头皮缝好）、五皮枕头（五皮即陈皮、梨皮、苹果皮、柿子皮和西瓜皮）、茶叶枕头（泡饮后的茶叶与菊花、茉莉拌匀）、决明子枕头（决明子和棉花包裹后装入枕头皮）。、 颜色选择：不会引起兴奋的颜色。气候温度与色调也可进行平衡。 红：失眠。橘黄色：诱发食欲，可用于老年人（浅橘色）。嫩绿色：舒缓情绪。金黄色：易狂躁。蓝色：助眠。紫色：安神，有利于钾平衡(?)，对心脏系统有压抑作用(?)。 第二部分 关于睡眠的心理科学和脑科学 睡与醒 睡眠时大脑仍在工作。 参与睡眠的部分： 丘脑：掌控睡眠与觉醒，在睡眠和清醒时扮演不同的角色。睡眠时，呈现间歇性成簇发放动作电位，让大脑皮层失去对信息的处理能力；清醒时，兴奋性细胞连续不断地发放动作电位。浅睡时产生大量纺锤波和慢波，纺锤波就集中在丘脑部位。 下丘脑：在电极刺激后很快进入昏睡。 海马体、中缝核、网状结构、蓝斑等。 生物节律扮演重要角色。 哺乳动物双眼在阳光（光线）刺激下会抑制松果体分泌褪黑素。褪黑素会帮助机体做好睡眠准备。蓝光会对其有抑制效果。 外服褪黑素仅对缺乏褪黑素的情况适用。 腺苷：免疫抑制剂，进入心肌，磷酸转换成腺苷酸，参与心肌部分能量代谢，且能扩张冠脉血管，增加血流量；在中枢神经系统，通过受体结合，对兴奋性神经元的活动起到抑制作用，调节机体“睡眠 觉醒”过程。“睡眠因子” 咖啡碱：中枢腺苷受体的一种拮抗剂。代谢一杯的所需时间长达 7 h，完全代谢需要 8 14 h，有些情况下甚至需要时间更长。睡着后咖啡碱仍然会发挥作用，影响睡眠质量，让深度睡眠时间缩短。 作用效果相同的还有茶碱、茶多酚。建议睡前 12 h 不要饮用。 睡眠紊乱对免疫的影响：导致肾上腺素等调节“睡眠 觉醒”节律的激素被破坏，抑制 T 细胞的能力。多巴胺、肾上腺素、前列腺素会降低 T 细胞与抗原的黏合力，而这些激素都是促进人体觉醒的主要成分。 前列腺素会增强机体对痛觉的敏感性。 睡眠状态下这些的分泌量会下降。 06:00 左右是 T 细胞工作的峰值，过早清醒或过晚入睡都不好。 多巴胺能神经系统(?)在控制人体“睡眠 觉醒”中起到重要作用。多巴胺能主要作用：调节机体锥外体系运动（肌肉运动与平衡，协调肌张力，多巴胺与乙酰胆碱的平衡）、控制精神活动（认知、学习、记忆、情绪等）、调控内分泌系统。 对多巴胺进行人为干预，可以在短时间内达到促进睡眠的效果。不过，多巴胺分泌过多会导致成瘾；长时间工作也会让多巴胺发生失衡。 人会做梦，但通常会忘记梦境。海马体是记录梦境的器官，同时也负责人类记忆。大脑苏醒但海马体还未苏醒，所以梦境记忆短暂或记不住。进入睡眠时的海马体很活跃，帮助大脑对白天的记忆进行存储。 抑郁症患者和失眠症患者在同一脑区出现问题。睡眠质量较差的人群，大脑外侧眶额皮层（与负面情绪相关）、背侧前额叶皮层（与短时记忆相关）和楔叶（与自我相关的脑区）等区间信号的功能连接即同步性明显升高。 虽说早睡早起好，但每个人有自己的生物节律，有的人适合晚睡，有的人适合早睡，应以遵循个人生物节律为主。 所有睡眠问题几乎都是情绪问题 焦虑导致的精神紧张、胡思乱想等都是早哼入睡困难的直接原因。 偶尔一天或几天少睡几小时不足以构成失眠，只要不长期让生物钟紊乱，就不会对身体造成太大伤害。 应对焦虑的方案：聚焦。确定当下心情 → 确定焦虑原因 → 确定后果 → 确定解决方案。在过程中焦虑会逐渐消失。 不能带着怒气入睡。带有愤怒的负面情绪在过夜之后会更加深刻，甚至到难以逆转的地步。 记忆由海马体进行存储，掌管情绪的杏核仁不能储存记忆，但能辅助记忆保存。人在睡眠时会对记忆进行修复，也会对情绪进行巩固。 人的大脑在睡眠中会重新组织负面记忆的储存方式，使这些感觉日后更加难以压制。 处理方法：通过“倒数法”，倒数数字让自己情绪平复。12 15 开始倒数比较合适。最好还是找办法消除造成愤怒的原因。 有心理压力从而难以入睡的解决方法：睡前运动，睡前 3 小时进行。原理：避免人体久不运动造成的摄氧量降低的问题（肌肉中乳酸固化、骨骼中钙质下降，体内物质与氧气结合也会严重不足）。 运动选择：散步、慢跑。跑步与散步相比更能释放压力：跑步促进皮质醇分泌，停止运动后皮质醇分泌就会放缓；还能促进 5 羟色胺、多巴胺、内啡肽的分泌。 慢跑最佳时间：傍晚、晚饭后 1 h 至 睡前 3 h 之间，30 min 最为合适。 正面情绪对睡眠也会有影响，过于亢奋也会影响睡眠。 避免任何类型的电影。可以看专业性较强或轻心灵的书籍(?)，让大脑冷静下来。 倾诉是有效的心理疏导方法。情绪的排解方式共有四类：倾诉、抱怨、运动、哭泣。 方法：自己对自己倾诉（跟自己交流时会在心理方面产生应激反应，可以中和负面情绪）、做点自己喜欢的事情（吃点甜食、玩解压玩具）(?)、付费倾诉（心理咨询等）。 白天需要集中精力做事，避免大脑间歇性地处在松懈状态，防止晚上睡眠激素产生不足而没有睡意。但也不能过度劳累，多巴胺分泌会导致人亢奋。 集中注意力工作或学习不会过分刺激中脑腹侧被盖区的多巴胺神经回路，有助于普通人的正常睡眠。过长时间打游戏等就会导致多巴胺大量分泌，晚上就有可能睡不好。 白天集中精力与注意力，有助于提高大脑灵活度和活跃度，让交感神经充分发挥作用，进入科学的运转节奏。 如果发现有睡眠障碍，可以试着用提升专注程度的方法来调节。例如做整理性、打扫性的家务，或进行不需要智力参与但需要绝对专注的游戏(?)。 反作用法促进睡眠：告诉自己“不能睡”。本质：心理暗示，最早应用于对应激性强迫行为的缓解（紧张时挠头扣手等）。可以广泛应用于所有难以摆脱的心理情况。 数羊（数水饺）无效：情绪紧张。观息法：起源于印度巴利语，借助观察自身呼吸，让自己在无意识中进入自省和自我洞察的状态；可以加入一些最能让自己平静的元素进行幻想。 专注于呼吸训练可以修复高级神经系统。 尝试腹式呼吸。 一般来讲，对于因心理问题而导致的睡眠障碍，进行为期 2 周、每晚 20 分钟左右的腹式呼吸就能有不同程度的缓解。但腹部深呼吸在某些人可能会导致心理创伤复发。 克服睡眠障碍 人体觉醒后一般会在第 17 小时开始出现意识混沌的状态。茶、咖啡只能提升大脑兴奋度，对缓解疲劳无效。 解决倒时差问题：提前改变作息时间，一个时区大概需要 1 天；在飞机上睡一觉（仅适用于短期工作或旅游）；用墨镜等方法减少光的接受程度，可以让身体尽快适应时差。 “认床”的原因：缺乏安全感、生物钟没有及时调整。 很难解除，不过有解决方法：营造熟悉的氛围（模拟气味、带着床单等方法）；枕头垫到膝盖下方或脚踝下方；窗帘留一点光，或开小夜灯。 本质：创建熟悉氛围。 出差失眠原因：环境陌生（参考前文解决方法）、焦虑（参考前文解决方法）、环境较差。 适合睡眠的温度：20 23 ℃，同时避免过于干燥。 终止报复性熬夜：解决拖延（做事利索一点，在晚上挤出更多空闲娱乐时间）、做出计划（将晚上要做的事情罗列，提高晚上活动的效率）。 手机散发的蓝光会干扰松果体的判断，让人难以入睡。蓝光时最容易被双眼感知的。自然中大多来自太阳。如果在夜间使用 2 h 蓝光设备，就会抑制超过 20% 的褪黑素的分泌。 解决起床困难：让光线充满整个房间。 起床困难的危害：导致人体机能衰退（心脏收缩力因过长时间放缓而失去力量）、室内空气危害呼吸（起得晚则空气不能及时得到更换，易生病）、肌张力低下（醒来后立刻活动能让肌肉供血量增加，让肌肉纤维变粗变韧）、影响胃肠道功能（不按时摄入早餐，饥饿性蠕动，本质是导致了饮食不规律） 起来后可以先将窗帘打开，让阳光照进房间，做几组深呼吸后再洗漱。 睡眠自我检测：PSQI；记录睡眠日志。"},{"title":"苏州-虎丘片区","url":"/travel/240107s/","category":"🚃 旅和游","tags":[],"text":"此次出行是匆忙且随机应变的。 前一个周工作日的时候，我突然发现星穹铁道在苏博的联动 10 号就要结束了，而早在去年国庆时就考虑过去苏州看看，加之对错过星铁与上海天文馆的联动耿耿于怀，于是在简单确认了单日往返的可行性后，决定不再犹豫。周六晚上闲下来时确定了出发的路线以及第一站，第二天就背着包出发了。后续前往虎丘、山塘街都是高铁、苏州公交上定下的，具体路线也是在辗转途中匆匆在地图导航上搜索，甚至返程票都是快返回的时候才购买。 苏州博物馆西馆 西馆的入口背向道路，面朝狮子山。站在门口向狮子山顶望去，能看到驻足远眺的点点人影。阿基维利的列车就停在门口，中午从博物馆出来的时候能在旁边看到三三两两打卡的 coser，倒是没看到本次联动主角阮·梅的 cos，或许是因为她的原设衣裳实在不太适合这个季节。9 点第一批入馆的人群中，不少人的第一要事便是跑去领取联动明信片。其中不乏凑热闹排队的，拿到物料仔细端详后才大悟原来是什么游戏的联动；还能看到小孩儿拿着明信片在场馆里正儿八经地四处打卡。 西馆主要从两方面介绍了苏州：历史发展及工艺与艺术。跟着路线走过吴越楚，见过资本主义的萌芽，看过精巧绝伦的核舟，赏过栩栩如生的画绣，苏州不失力量的温婉得以铺开展现，看下来还是很满足的。在艺术区看到了虎丘牌阮，再加上走在路上似乎也见到过乐器阮的形象，就思索或许这算是苏州的某个元素，顿感让阮·梅来联动苏博确实再合适不过。二楼国际馆展出的是大英博物馆的希腊主题的展品，展现了从出生到死亡贯穿于希腊人一生的“竞争”主题。纯蓝色的绶带、大理石石雕的米白色和描绘神话的金色，三个颜色组合在一起透露出一种理性和智慧之感。三楼的特展是宋易格女士的“故事的故事（tale of tales）”特展，画作比较强调个人表达，即“画家画出的应是画家眼中看到的世界”。大胆鲜艳的背景配色、简洁的画面主题以及零散攀附在画作各处的英文注解，共同向观众描述了画家鲜明的个人风格。 场馆内还提供 AR 交互讲解服务，确实让我眼前一亮，不过最终是没有去体验。 西园寺 虽然网上说西馆的东西不如主馆多，但一路逛的逛拍的拍，也耗去了整个上午。思考午餐吃什么的时候突然对西园寺的素面起了兴趣，于是选择前往西园寺。寺院东门门口停着两三辆卖烤肠的摊车，多少有一点黑色幽默。我对佛学毫无兴趣，只想着找个地方填饱肚子，所以一进门就在四处寻找地图上的“素斋馆”。院内转了大半圈也没找到，倒是找到一个排着长队的卖“西园素包”的窗口，但我畏惧队伍的长度所以没有尝试。包子铺后面黄墙围成的公园里有不少在草丛中躺成一滩的腰肥膀圆的猫，个个怡然自得，或睡或醒的都吸引游人围观。还见到在大树足部来回环绕躲避人们视线的刺猬，以及站在低垂的树枝上接受高举着手的人们喂养的白鸽。在一面排列着佛像的墙前看到募捐箱上写着“随喜功德”，才知道网上见到的“随喜赞叹”原来是来源于佛教用语，也算是长了知识了。 我好不容易转悠到了素斋馆门前，看见门内门外又是满满排队的人群，终于失去了兴致，探头看了两眼便走了。 虎丘 按照 B 站看到的攻略从北门进入虎丘，所以能看到冬日的阳光给高处的塔楼打上一层柔光。到了塔前才发现这塔楼原来是朝着北方歪下去的，能看出时间在塔楼的砖瓦上刻出的痕迹。继续向南走，就能看到剑池和三两座园林。剑池以其长且窄的形状得名，两侧高耸的石壁上能见到不少题字。以前去爬山的时候倒是能在山上看到不少，没想到在这里也能见到。山丘东侧修了一座“望苏台”，远眺能看到苏州现代化的钢筋水泥森林。苏东坡曾说“到苏州而不游虎丘，乃憾事也”，可能追求的就是一种登高望远的情怀吧，这点上往日今时大抵相同，不过以前能看到的景色里应该能有更多绿意？ 继续沿着中轴线向南走，在长且宽的阶梯上停着介绍非遗的小木车，或有泥塑、云糕种种，不过往来的游客少有驻足的意思。看地图上中轴线的东西两侧还有两个园林，但观感上实在有些疲惫就没去一探究竟。 山塘街 这次苏州游，这段山塘街的徒步是我玩得最开心的部分。一方面它贡献了我当日总步数的一大部分，给予我巨大的成就感；另一方面它也确实通过建筑构成的气氛向我展现了不少历史与现今的连结。要说不满意的地方倒也有：从虎丘出来的前半段有一块街道正在修整，地图又不甚精确，绕路找路费了不少脚力；而且最后忘记去终点附近的白居易码头看一看了。不过绝大部分确实让我心满意足。 山塘街很明显地在空间上存在热闹程度上的渐变。从虎丘南门刚出来，从西北方进入山塘街的时候，能迎面感到一种老村镇中有的冷清。街旁老旧的黛瓦白墙锈铁门里住着被时间追赶的老人。方砖石路上游人寥寥，能从山塘街东南那头走到这里的或许多少都有些探险精神。不过就是从这样老旧的街道里、攀满枯死爬山虎的某小学的墙壁上，和嵌在墙里写着粉笔字的黑板中，能体会到某种独特的、苏州的、夹杂着历史的陈旧味儿的烟火气息。在路上碰到一个售卖旧货的中年人，大敞街边两个仓库，暴露出里面堆满的旧书旧物。地上摆着的一些物品中，有上海产的老手表，有便携救命的针灸医书，也有文革时期的小红书，凡此种种确实让我感到颇为新奇。中年人自如地和好奇的行人闲谈，似乎也不追求非要卖掉什么。我确实是对文革时期小红书颇感兴趣的，但 40 块一本我不太能接受。 继续沿街向东南步行，穿过高铁下的一条隧道，商业化便逐渐开始显露痕迹，那条高铁轨道似乎成为了某种分隔符。街道上逐渐出现摆在外面的小摊、试图招揽游人的旧卖铺，甚至卖烤羊肉串和烤鱿鱼的小吃摊口，和高度现代化装修的咖啡馆。深深探入街道内部的巷子也愈发常见，游人也从三三两两变得熙熙攘攘。直到最东南边的七里山塘入口，就成为了俨然一副你想象中的网红古街的模样。相比于此，我还是更喜欢前面西北边那一段。不过这一段里确实有不少网上见过的老字号名店，离先前看过的住宿地点也近，以后再来玩的时候倒是可以过来体验点老字号。 吃完晚饭——比较奇特的是饭店的服务员还专门说是否需要拍照，但他们的上菜速度让我有点怀疑是预制菜——后面还专门坐公交去寒山寺转了一圈，但是似乎 7 点左右是有点太晚了，真是字面意义上的一个人都没有。全怪《枫桥夜泊》给了我一种一定要晚上去寒山寺的错觉，而且寒山寺在我古早的想象中是一个江、山、寺、月的意象，到了一看才发现并没有山，寺院的高塔也没有高得足够引人瞩目。商铺也统统关门了，来这里打卡盖章的最初想法也打了水漂。只得悻悻离开。 不过此行确实让我发现去苏州很方便。下一次去或许就是苏博本馆那一片了。 最后放一下行程时间表 5:30 起床 6:50 地铁、公交到虹桥站 7:19 上海虹桥站 → 7:58 → 苏州站 8:40 苏博西馆（提前预约） 12:10 离开西馆 13:00 抵达西园寺 13:30 离开西园寺 13:49 抵达虎丘（￥60） 15:35 离开虎丘，进入山塘街 17:10 离开山塘街 18:08 乘公交前往寒山寺 19:29 乘公交前往苏州站 20:08 苏州站 → 20:44 → 上海站"}]</script></section><script type="module" src="/_astro/SearchOverlay.astro_astro_type_script_index_0_lang.BUCrK74S.js"></script><button data-astro-transition-persist="back-to-top" id="back2topBtn" aria-label="返回顶部"><span class="icon-mask" style="--icon-url: url('/icons/back2top.svg')" aria-hidden="true"></span></button><dialog data-astro-transition-persist="image-lightbox" class="image-lightbox" id="image-lightbox" aria-label="图片查看器"><div class="lightbox-stage"><i class="lightbox-loader" aria-hidden="true"></i><img id="lightbox-image" alt=""></div><button class="lightbox-close" type="button" aria-label="关闭图片查看器">×</button><button class="lightbox-previous" type="button" aria-label="上一张图片">‹</button><button class="lightbox-next" type="button" aria-label="下一张图片">›</button><footer class="lightbox-meta"><span id="lightbox-caption"></span><span id="lightbox-counter"></span></footer></dialog><script type="module" src="/_astro/BaseLayout.astro_astro_type_script_index_0_lang.zRt66vxl.js"></script></body></html>
